<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSewa Payment UI</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #1a1d21; /* Dark background from the image */
    color: #ffffff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* Navbar Styles */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 20px 50px;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
}

.lang-selector {
    font-size: 14px;
    cursor: pointer;
    border: 1px solid #444;
    padding: 5px 10px;
    border-radius: 4px;
}

/* Layout Container */
.container {
    display: flex;
    flex: 1;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
    align-items: center;
    gap: 40px;
}

/* Left Section */
.payment-info {
    flex: 1;
    padding: 20px;
}

.merchant-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
}

.merchant-icon {
    background-color: #60bb46;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

.amount-display p {
    color: #aaa;
    font-size: 14px;
}

.amount-display h1 {
    font-size: 32px;
    color: #a4c639; /* Light green color for amount */
    margin: 10px 0 30px 0;
}

.details-table {
    background: rgba(255, 255, 255, 0.05);
    padding: 20px;
    border-radius: 4px;
}

.row {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    color: #ccc;
}

hr {
    border: 0;
    border-top: 1px solid #444;
    margin: 15px 0;
}

.total {
    font-weight: bold;
    color: #fff;
}

/* Right Section - Login Card */
.login-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.login-card {
    background-color: #2c3036;
    padding: 40px;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
}

.login-card h3 {
    margin-bottom: 25px;
    font-weight: 400;
    color: #ddd;
}

.input-group {
    position: relative;
    margin-bottom: 20px;
}

.input-group i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #60bb46;
}

.input-group .eye-icon {
    left: auto;
    right: 15px;
    color: #777;
    cursor: pointer;
}

.input-group input {
    width: 100%;
    padding: 15px 15px 15px 45px;
    background-color: #1a1d21;
    border: 1px solid #444;
    border-radius: 4px;
    color: white;
    outline: none;
}

.login-btn {
    width: 100%;
    padding: 15px;
    background-color: #8da46e; /* Muted green from image */
    border: none;
    border-radius: 4px;
    color: #1a1d21;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

.forgot-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #a4c639;
    text-decoration: none;
    font-size: 14px;
}

.register-text {
    margin-top: 30px;
    font-size: 14px;
    color: #aaa;
}

.register-text a {
    color: #a4c639;
    text-decoration: none;
}

.cancel-link {
    margin-top: 40px;
    color: #aaa;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
}

    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">eSewa</div>
        <div class="lang-selector">English <i class="fas fa-chevron-down"></i></div>
    </header>

    <main class="container">
        <section class="payment-info">
            <div class="merchant-header">
                <div class="merchant-icon">e-</div>
                <span class="merchant-name">EPAYTEST</span>
            </div>

            <div class="amount-display">
                <p>Total Amount</p>
                <h1>NPR. 1,000.00</h1>
            </div>

            <div class="details-table">
                <div class="row">
                    <span>Product Amount</span>
                    <span>1,000.00</span>
                </div>
                <hr>
                <div class="row total">
                    <span>Total Amount</span>
                    <span>1,000.00</span>
                </div>
            </div>
        </section>

        <section class="login-section">
            <div class="login-card">
                <h3>Sign in to your account</h3>
                <form>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="eSewa ID">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password/MPIN">
                        <i class="fas fa-eye-slash eye-icon"></i>
                    </div>
                    
                    <button type="submit" class="login-btn">LOGIN</button>
                </form>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
            
            <p class="register-text">Don't have an account? <a href="#">Register</a></p>
            <a href="#" class="cancel-link">CANCEL PAYMENT</a>
        </section>
    </main>

</body>
</html>
