<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Admin Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Reset & Fonts */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: #121212; color: #fff; }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: 220px;
            height: 100%;
            background-color: #1f1f1f;
            padding: 20px;
        }
        .sidebar h2 { color: #00ff00; margin-bottom: 30px; }
        .sidebar a {
            display: block;
            color: #ccc;
            text-decoration: none;
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .sidebar a:hover, .sidebar a.active { background-color: #00ff00; color: #000; }

        /* Main content */
        .main {
            margin-left: 240px;
            padding: 20px;
        }

        /* Top bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .topbar button {
            padding: 8px 15px;
            background-color: #00ff00;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Metrics cards */
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            flex: 1;
            padding: 20px;
            border-radius: 10px;
            background-color: #1f1f1f;
            text-align: center;
            border: 2px solid;
        }
        .card.total-members { border-color: #9b59b6; }
        .card.total-trainers { border-color: #3498db; }
        .card.revenue { border-color: #e67e22; }
        .card h3 { margin-bottom: 10px; color: #fff; }
        .card p { font-size: 24px; font-weight: bold; }

        /* Charts section */
        .charts {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .chart-container {
            flex: 1;
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
        }

        /* Recent activity */
        .recent-activity {
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
        }
        .recent-activity h3 { margin-bottom: 15px; }
        .recent-activity ul { list-style: none; }
        .recent-activity li {
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        .recent-activity li:last-child { border-bottom: none; }
        .purple { color: #9b59b6; }
        .cyan { color: #3498db; }

    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>GYM ADMIN</h2>
        <a href="#" class="active">Dashboard</a>
        <a href="#">Members</a>
        <a href="#">Trainers</a>
        <a href="#">Logout</a>
    </div>

    <!-- Main content -->
    <div class="main">
        <!-- Topbar -->
        <div class="topbar">
            <h2>Welcome, admin</h2>
            <button>Logout</button>
        </div>

        <!-- Metrics Cards -->
        <div class="cards">
            <div class="card total-members">
                <h3>Total Members</h3>
                <p>4</p>
            </div>
            <div class="card total-trainers">
                <h3>Total Trainers</h3>
                <p>7</p>
            </div>
            <div class="card revenue">
                <h3>Revenue</h3>
                <p>Rs 280000</p>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts">
            <div class="chart-container">
                <h3>Members & Trainers Growth</h3>
                <canvas id="growthChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Active Classes</h3>
                <canvas id="classesChart"></canvas>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="recent-activity">
            <h3>Recent Activity Feed</h3>
            <ul>
                <li><span class="purple">Jane Doe joined</span> - 1</li>
                <li><span class="cyan">Yoga class update</span> - 5</li>
            </ul>
        </div>
    </div>

    <!-- Chart.js Scripts -->
    <script>
        // Members & Trainers Growth
        const ctxGrowth = document.getElementById('growthChart').getContext('2d');
        const growthChart = new Chart(ctxGrowth, {
            type: 'line',
            data: {
                labels: ['20m','10pr','4lur','20m','40pr','30m','30m','20nr'],
                datasets: [
                    {
                        label: 'Members',
                        data: [0, 20, 50, 30, 70, 100, 140, 180],
                        borderColor: '#9b59b6',
                        backgroundColor: 'rgba(155,89,182,0.2)',
                        tension: 0.4
                    },
                    {
                        label: 'Trainers',
                        data: [0, 10, 30, 25, 60, 90, 130, 170],
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52,152,219,0.2)',
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: {
                    x: { ticks: { color: '#fff' }, grid: { color: '#333' } },
                    y: { ticks: { color: '#fff' }, grid: { color: '#333' } }
                }
            }
        });

        // Active Classes
        const ctxClasses = document.getElementById('classesChart').getContext('2d');
        const classesChart = new Chart(ctxClasses, {
            type: 'bar',
            data: {
                labels: ['Yoga','Spin','Spin','Cardio'],
                datasets: [
                    {
                        label: 'Class 1',
                        data: [12, 36, 30, 75],
                        backgroundColor: '#3498db'
                    },
                    {
                        label: 'Class 2',
                        data: [8, 55, 24, 83],
                        backgroundColor: '#9b59b6'
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: {
                    x: { ticks: { color: '#fff' }, grid: { color: '#333' } },
                    y: { ticks: { color: '#fff' }, grid: { color: '#333' } }
                }
            }
        });
    </script>
</body>
</html>
